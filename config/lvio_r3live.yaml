# 结果输出路径
outputpath: ""
is_make_outputdir: true

# 是否开启可视化
is_use_visualization: true

# ROS接口配置
ros:
    imu_topic: /livox/imu
    image_topic: /cam0
    lidar_topic: /livox/lidar
    use_compressed_image: true # 使用压缩图像

    # 读取ROS包
    is_read_bag: true
    bag_file: ""

# IMU噪声建模参数
imu:
    imudatarate: 200 # IMU原始数据频率, Hz

    arw: 1.0 # deg/sqrt(hr)
    vrw: 2.0 # m/sqrt(hr)
    gbstd: 100 # deg/hr
    abstd: 200 # mGal
    corrtime: 1.0 # hr

    gb_prior_std: 1500 # deg/hr
    ab_prior_std: 15000 # mGal

# 优化器
optimizer:
    optimize_reprojection_std: 1.5 # 像素重投影误差
    optimize_point_to_plane_std: 0.1 # 点到面观测协方差, m
    optimize_window_size: 10 # 滑动窗口大小
    optimize_calculate_covariance: false # 是否计算输出最新状态协方差

    optimize_estimate_cam_extrinsic: true # 是否估计相机和IMU的外参
    optimize_estimate_cam_td: true # 是否估计相机和IMU之间的时间间隔
    optimize_cam_extrinsic_accurate: true # 相机和IMU的外参初值准确

    optimize_estimate_lidar_extrinsic: true # 是否估计雷达和IMU的外参
    optimize_estimate_lidar_td: true # 是否估计雷达和IMU之间的时间间隔
    optimize_lidar_extrinsic_accurate: true # 雷达和IMU的外参初值准确

visual:
    is_use_visual: true # 是否使用相机
    is_use_lidar_depth: true # 使用激光深度增强

    track_max_features: 200 # 最大提取特征数量
    track_aiding_source: 2 # 无辅助: 0; 像素速度先验辅助: 1; INS先验辅助: 2

    # 内参 [fx, fy, cx, cy(, skew)]
    intrinsic: [863.4241, 863.4171, 640.6808, 518.3392]

    # 畸变参数 [k1, k2, p1, p2(, k3)]
    distortion: [-0.1080, 0.1050, -1.2872e-04, 5.7923e-05, -0.0222]

    # 图像分辨率
    resolution: [1280, 1024]

    # 相机IMU外参 Pb = q_b_c * Pc + t_b_c
    # q (x, y, z, w)
    q_b_c: [0.499629, 0.504424, 0.495035, 0.500867]
    t_b_c: [0.058, -0.069, 0.013]

    # IMU和相机时间延时
    # t_b = t_c + td
    td_b_c: 0.01

lidar:
    is_use_lidar: true
    is_use_frame_to_map: true # 使用frame-to-map, 全局地图由被边缘化帧在线构建

    # 激光参数
    lidar_type: 1 # Livox: 1; Velodyne: 2; Ouster: 3; Hesai: 4
    scan_line: 6 # 扫描线数
    point_filter_num: 3 # 原始点抽取滤波器
    nearest_distance: 0.5 # 扫描盲区, m
    farthest_distance: 300 # 最远距离, m
    frame_rate: 10 # 帧率, Hz

    # 点云处理
    downsample_size: 0.5 # 体素滤波栅格大小, m
    plane_estimation_threshold: 0.1 # 平面拟合最大点到面距离, m
    is_save_pointcloud: false # 保存点云地图

    # 雷达IMU外参 Pb = q_b_l * Pl + t_b_l
    # q (x, y, z, w)
    q_b_l: [0.999886, -0.001194, -0.009450, 0.011756]
    t_b_l: [-0.046, -0.027, 0.019]

    # IMU时间延时
    # t_b = t_l + td
    td_b_l: 0.0
